<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Martti Kims — Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background: #00241B;
        font-family: 'Outfit', sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ─── KEYFRAMES ─────────────────────────────────────── */
      @keyframes fadeUp   { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
      @keyframes pulse    { 0%,100%{opacity:.6} 50%{opacity:1} }
      @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
      @keyframes spin     { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes draw     { from{stroke-dashoffset:1000} to{stroke-dashoffset:0} }
      @keyframes blink    { 0%,100%{opacity:1} 49%{opacity:1} 50%{opacity:0} }
      @keyframes glow     { 0%,100%{filter:drop-shadow(0 0 8px #00ECC1)} 50%{filter:drop-shadow(0 0 24px #00ECC1)} }
      @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

      /* ─── FULL PAGE SVG WRAPPER ─────────────────────────── */
      .page-svg {
        width: 100vw;
        min-height: 100vh;
        display: block;
      }

      /* Scanline overlay */
      .scanline {
        position: fixed; top:0; left:0; width:100%; height:60px;
        background: linear-gradient(transparent, rgba(0,236,193,0.03), transparent);
        pointer-events: none; z-index: 100;
        animation: scanline 6s linear infinite;
      }

      /* ─── SVG TEXT & ELEMENT ANIMATIONS ─────────────────── */
      .hero-name    { animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .1s both; }
      .hero-role    { animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .25s both; }
      .hero-desc    { animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .4s both; }
      .hero-btns    { animation: fadeUp .9s cubic-bezier(.22,1,.36,1) .55s both; }
      .card-1       { animation: fadeUp .8s cubic-bezier(.22,1,.36,1) .65s both; }
      .card-2       { animation: fadeUp .8s cubic-bezier(.22,1,.36,1) .75s both; }
      .card-3       { animation: fadeUp .8s cubic-bezier(.22,1,.36,1) .85s both; }
      .deco-ring    { animation: spin 18s linear infinite; transform-origin: center; transform-box: fill-box; }
      .deco-ring2   { animation: spin 12s linear infinite reverse; transform-origin: center; transform-box: fill-box; }
      .blob-1       { animation: float 7s ease-in-out infinite; }
      .blob-2       { animation: float 9s ease-in-out infinite reverse; }
      .path-draw    { stroke-dasharray:1000; stroke-dashoffset:1000; animation: draw 3s ease .3s forwards; }
      .status-dot   { animation: pulse 2s ease infinite; }
      .glow-ring    { animation: glow 3s ease-in-out infinite; }

      /* ─── INTERACTIVE BUTTONS ───────────────────────────── */
      .btn-main rect, .btn-ghost rect { transition: all .2s; }
      .btn-main:hover rect { fill: #00ECC1; }
      .btn-main:hover text { fill: #00241B; }
      .btn-main text, .btn-ghost text { transition: fill .2s; }
      .btn-ghost:hover rect { fill: rgba(0,236,193,.12); stroke: #00ECC1; }
      .btn-ghost:hover text { fill: #00ECC1; }
      .btn-main, .btn-ghost { cursor: pointer; }

      /* ─── SKILL TAGS ────────────────────────────────────── */
      .skill-tag rect { transition: all .2s; }
      .skill-tag:hover rect { fill: rgba(0,236,193,.2); }
      .skill-tag { cursor: default; }

      /* ─── PROJECT CARDS ─────────────────────────────────── */
      .proj-card { cursor: pointer; }
      .proj-card .card-bg { transition: all .25s; }
      .proj-card:hover .card-bg { fill: rgba(0,201,141,.12); }
      .proj-card .card-border { transition: all .25s; }
      .proj-card:hover .card-border { stroke: #00ECC1; opacity:1; }

      /* ─── CURSOR ────────────────────────────────────────── */
      #cursor {
        position: fixed; top:0; left:0; width:12px; height:12px;
        background: #00ECC1; border-radius:50%; pointer-events:none;
        z-index:999; mix-blend-mode: difference;
        transform: translate(-50%,-50%);
        transition: width .15s, height .15s, opacity .15s;
      }
    </style>
  </head>
  <body>
    <div class="scanline"></div>
    <div id="cursor"></div>

    <!-- ═══════════════════════════════════════════════════════
         FULL-PAGE SVG
         ViewBox: 1440 × 900 — scales to any screen
    ═══════════════════════════════════════════════════════ -->
    <svg class="page-svg"

      <!-- ╔══════════════════════════════╗
           ║  DEFS                        ║
           ╚══════════════════════════════╝ -->
      <defs>
        <!-- Background gradient -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#00241B"/>
          <stop offset="60%"  stop-color="#00241B"/>
          <stop offset="100%" stop-color="#001510"/>
        </linearGradient>

        <!-- Teal accent glow -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="18" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowSm" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowLg" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="40" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Card gradient -->
        <linearGradient id="cardGrad1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#00493A" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#00241B" stop-opacity=".8"/>
        </linearGradient>
        <linearGradient id="cardGrad2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#00725C" stop-opacity=".25"/>
          <stop offset="100%" stop-color="#00241B" stop-opacity=".9"/>
        </linearGradient>
        <linearGradient id="cardGrad3" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#00C09D" stop-opacity=".2"/>
          <stop offset="100%" stop-color="#00241B" stop-opacity=".85"/>
        </linearGradient>

        <!-- Grid pattern -->
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
          <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#00493A" stroke-width=".5" opacity=".4"/>
        </pattern>

        <!-- Dot pattern -->
        <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" fill="#00725C" opacity=".35"/>
        </pattern>

        <!-- Clip for main content area -->
        <clipPath id="mainClip">
          <rect x="0" y="0" width="1440" height="900"/>
        </clipPath>

        <!-- Name gradient text -->
        <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#CEFFEF"/>
          <stop offset="50%" stop-color="#00ECC1"/>
          <stop offset="100%" stop-color="#00C09D"/>
        </linearGradient>

        <!-- Marker -->

          <path d="M0,0 L0,6 L8,3 z" fill="#00C09D" opacity=".6"/>

      <g class="blob-2">

      <!-- ╔══════════════════════════════╗
           ║  INLINE SCRIPT               ║
           ╚══════════════════════════════╝ -->
      <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        /* ─── ANIMATED SKILL BARS ────────────────────────── */
        const skills = [
          { label: "POWER APPS",    pct: 75, color: "#00ECC1", opacity: ".85" },
          { label: "PYTHON",            pct: 50, color: "#00C09D", opacity: ".85" },
          { label: "POWER AUTOMATE",    pct: 65, color: "#00A87D", opacity: ".85" },
          { label: "COPILOT STUDIO",    pct: 60, color: "#00725C", opacity: ".9"  },
          { label: "CLAUDE / CODEX",    pct: 65, color: "#00ECC1", opacity: ".75" },
          { label: "SQL",               pct: 35, color: "#CEFFEF", opacity: ".5" },
        ];

        const BAR_X      = 740;   // left edge of bar track
        const BAR_TRACK  = 320;   // full track width
        const ROW_START  = 150;   // y of first label text
        const ROW_STEP   = 37;    // vertical spacing between rows
        const LABEL_OFF  = 15;    // label text y-offset from row top
        const BAR_OFF    = 22;    // bar rect y-offset from row top
        const PCT_OFF    = 30;    // percentage text y-offset from row top
        const DURATION   = 900;   // animation ms
        const DELAY_STEP = 120;   // stagger ms per bar

        const ns  = "http://www.w3.org/2000/svg";
        const grp = document.getElementById("skill-bars");

        skills.forEach((s, i) => {
          const rowY = ROW_START + i * ROW_STEP;

          // Label
          const lbl = document.createElementNS(ns, "text");
          lbl.setAttribute("x", BAR_X);
          lbl.setAttribute("y", rowY + LABEL_OFF);
          lbl.setAttribute("font-size", "12");
          lbl.setAttribute("fill", "#CEFFEF");
          lbl.setAttribute("opacity", ".7");
          lbl.setAttribute("letter-spacing", "1");
          lbl.textContent = s.label;
          grp.appendChild(lbl);

          // Track background
          const track = document.createElementNS(ns, "rect");
          track.setAttribute("x", BAR_X);
          track.setAttribute("y", rowY + BAR_OFF);
          track.setAttribute("rx", "2"); track.setAttribute("ry", "2");
          track.setAttribute("width", BAR_TRACK);
          track.setAttribute("height", "5");
          track.setAttribute("fill", "#00241B");
          track.setAttribute("stroke", "#00493A");
          track.setAttribute("stroke-width", ".5");
          grp.appendChild(track);

          // Fill bar (starts at 0)
          const fill = document.createElementNS(ns, "rect");
          fill.setAttribute("x", BAR_X);
          fill.setAttribute("y", rowY + BAR_OFF);
          fill.setAttribute("rx", "2"); fill.setAttribute("ry", "2");
          fill.setAttribute("width", "0");
          fill.setAttribute("height", "5");
          fill.setAttribute("fill", s.color);
          fill.setAttribute("opacity", s.opacity);
          fill.setAttribute("filter", "url(#glowSm)");
          grp.appendChild(fill);

          // Percentage label (starts at 0%)
          const pctLabel = document.createElementNS(ns, "text");
          pctLabel.setAttribute("x", BAR_X + BAR_TRACK + 8);
          pctLabel.setAttribute("y", rowY + PCT_OFF);
          pctLabel.setAttribute("font-size", "11");
          pctLabel.setAttribute("fill", s.color);
          pctLabel.setAttribute("opacity", s.opacity);
          pctLabel.textContent = "0%";
          grp.appendChild(pctLabel);

          // Animate after staggered delay
          const targetW   = (s.pct / 100) * BAR_TRACK;
          const startTime = performance.now() + i * DELAY_STEP;

          function animate(now) {
            const elapsed = now - startTime;
            if (elapsed < 0) { requestAnimationFrame(animate); return; }

            const t        = Math.min(elapsed / DURATION, 1);
            // ease-out cubic
            const eased    = 1 - Math.pow(1 - t, 3);
            const currentW = eased * targetW;
            const currentP = Math.round(eased * s.pct);

            fill.setAttribute("width", currentW);
            pctLabel.textContent = currentP + "%";

            if (t < 1) requestAnimationFrame(animate);
          }

          requestAnimationFrame(animate);
        });
      </script>

    </svg><!-- /svg -->

    <!-- Custom cursor -->
    <script>
      const cursor = document.getElementById('cursor');
      document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top  = e.clientY + 'px';
      });
      document.querySelectorAll('a, .btn-main, .btn-ghost, .proj-card, .skill-tag').forEach(el => {
        el.addEventListener('mouseenter', () => { cursor.style.width='24px'; cursor.style.height='24px'; cursor.style.opacity='.7'; });
        el.addEventListener('mouseleave', () => { cursor.style.width='12px'; cursor.style.height='12px'; cursor.style.opacity='1'; });
      });
    </script>
